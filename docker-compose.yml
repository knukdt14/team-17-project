services:
  model:
    build: ./model
    env_file: .env
    volumes:
      - ./data/raw:/app/data/raw:ro
      - model_vectorstore:/app/vectorstore
      - model_uploads:/app/uploads
    ports:
      - "8100:8100"   # 디버깅용 (backend는 내부 네트워크로 접근)
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build: ./backend
    environment:
      MODEL_SERVICE_URL: http://model:8100
    depends_on:
      - model
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  model_vectorstore:
  model_uploads:
